version: '3.8'

services:
  # ── NewsFlow 전용 PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: newsflow-data-postgres
    environment:
      POSTGRES_DB: newsflow
      POSTGRES_USER: newsflow
      POSTGRES_PASSWORD: newsflow1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newsflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsflow -d newsflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow 전용 PostgreSQL (메타데이터 분리) ─────────────────────
  airflow-postgres:
    image: postgres:16
    container_name: newsflow-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow1234
    ports:
      - "5434:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - newsflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch (전문 검색) ────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: newsflow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - newsflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Redis (조회수 캐시 / 인기 기사 랭킹) ─────────────────────────
  redis:
    image: redis:7.2
    container_name: newsflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - newsflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow ──────────────────────────────────────────────────────
  airflow:
    image: apache/airflow:2.10.4
    container_name: newsflow-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow 자체 메타데이터 → airflow-postgres
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow1234@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: newsflow-airflow-secret
      PYTHONPATH: /opt/newsflow
      DATABASE_URL: postgresql+psycopg2://newsflow:newsflow1234@postgres:5432/newsflow
      # 수집 스크립트 전용 venv — Airflow(SQLAlchemy 1.4)와 환경 분리
      NEWSFLOW_PYTHON: /home/airflow/newsflow-venv/bin/python
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - .:/opt/newsflow
    depends_on:
      postgres:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
    networks:
      - newsflow-network
    command: >
      bash -c "
        python -m venv /home/airflow/newsflow-venv --system-site-packages &&
        /home/airflow/newsflow-venv/bin/pip install -r /opt/newsflow/requirements.txt -q &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname NewsFlow --lastname Admin --role Admin --email admin@newsflow.com || true &&
        cd /opt/newsflow && /home/airflow/newsflow-venv/bin/alembic upgrade head || true &&
        airflow webserver & airflow scheduler
      "

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_plugins:
  redis_data:
  es_data:

networks:
  newsflow-network:
    driver: bridge